name: CI (analyze & test)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/zzyoxml/md3Music.git
  UPSTREAM_REF: rust-local-force

jobs:
  analyze-and-test:
    name: 移植校验 / 静态分析 / 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout 移植层
        uses: actions/checkout@v4
        with:
          path: port

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 准备上游源码
        run: |
          set -euo pipefail
          if [ -f port/lib/main.dart ] && [ -f port/pubspec.yaml ]; then
            mkdir -p app
            tar -C port -cf - --exclude=.git --exclude=.github . | tar -C app -xf -
          else
            git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_REPO" app
          fi

      # ---------------------------------------------------------------
      # 1. 移植改造校验：patch_sources.py 内部对每一处锚点都做了断言，
      #    匹配不上会直接失败 —— 这一步保证"改造确实落地"而不是静默跳过。
      # ---------------------------------------------------------------
      - name: 叠加移植层（含改造断言）
        run: bash port/scripts/apply_overlay.sh "$PWD/app" "$PWD/port"

      - name: 校验改造结果
        run: |
          set -euo pipefail
          grep -q '"staticlib"' app/kugou_api_server/rust/Cargo.toml \
            || { echo "Cargo.toml 未加入 staticlib"; exit 1; }
          grep -q 'DynamicLibrary.process()' app/lib/services/kugou_server.dart \
            || { echo "Dart 未注入 DynamicLibrary.process()"; exit 1; }
          grep -q "_startServerInWorkerIos" app/lib/services/kugou_server.dart \
            || { echo "Dart 未注入 iOS worker"; exit 1; }
          echo "✅ 移植改造校验通过"

      - name: 安装依赖
        working-directory: app
        run: flutter pub get

      - name: 静态分析（flutter analyze）
        id: analyze
        working-directory: app
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log
          echo "analyze_exit=$?" 

      - name: 单元测试（flutter test）
        id: test
        working-directory: app
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test.log

      - name: 测试结果摘要
        if: always()
        run: |
          set -euo pipefail
          ANALYZE="${{ steps.analyze.outcome }}"
          TEST="${{ steps.test.outcome }}"

          # 从输出里粗略提取通过/失败数量
          PASSED=$(grep -oE '\+[0-9]+' /tmp/test.log 2>/dev/null | tail -1 | tr -d '+' || echo 0)
          FAILED=$(grep -oE '\-[0-9]+' /tmp/test.log 2>/dev/null | tail -1 | tr -d '-' || echo 0)

          {
            echo "## CI 结果"
            echo ""
            echo "| 环节 | 结果 |"
            echo "| --- | --- |"
            echo "| 移植改造校验 | ✅ 通过（锚点断言全部命中） |"
            echo "| flutter analyze | $([ "$ANALYZE" = success ] && echo '✅ 无问题' || echo '⚠️ 有告警/错误，见日志') |"
            echo "| flutter test | $([ "$TEST" = success ] && echo '✅ 全部通过' || echo '⚠️ 有失败用例，见日志') |"
            echo "| 用例统计 | 通过 ${PASSED:-0} / 失败 ${FAILED:-0} |"
            echo ""
            echo "> 测试在 Ubuntu runner 上运行，未链接 Rust 原生库，"
            echo "> 依赖本地 API 服务的用例会失败，属预期范围。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 输出 analyze / test 日志尾部
        if: always()
        run: |
          echo "===== flutter analyze (tail) ====="
          tail -40 /tmp/analyze.log 2>/dev/null || echo "(无输出)"
          echo
          echo "===== flutter test (tail) ====="
          tail -60 /tmp/test.log 2>/dev/null || echo "(无输出)"
