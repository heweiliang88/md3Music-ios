name: iOS Release (unsigned IPA)

# 触发方式：
#   1. 推送 v* 标签        -> 构建并创建 GitHub Release，附上 ipa
#   2. 手动 workflow_dispatch -> 只构建并上传 Artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 md3Music 分支/标签（移植基准）'
        required: false
        default: 'rust-local-force'
      attach_rust_server:
        description: '编译并链接 Rust API 服务器（失败不影响出包）'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/zzyoxml/md3Music.git
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'rust-local-force' }}
  ATTACH_RUST: ${{ github.event.inputs.attach_rust_server || 'true' }}

jobs:
  build-ipa:
    name: Build unsigned IPA
    # macos-14 只带 Xcode 15.4，SDK 过旧：
    # connectivity_plus 等插件已使用 iOS 26 SDK 的 API（NWPath.isUltraConstrained）
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout 移植层
        uses: actions/checkout@v4
        with:
          path: port

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 选择最新可用 Xcode
        run: |
          set -euo pipefail
          echo "镜像内可用 Xcode："
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$NEWEST" ]; then
            echo "切换到 $NEWEST"
            sudo xcode-select -s "$NEWEST"
          fi
          xcodebuild -version

      - name: 打印工具链版本
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version || true
          rustc --version || true

      - name: 准备图标处理依赖（Pillow，失败则自动回退 sips）
        id: pillow
        continue-on-error: true
        run: |
          set -euo pipefail
          # macOS runner 的 Python 是 Homebrew 外部管理环境（PEP 668），
          # 不能直接 pip install 到系统，这里用 venv。
          python3 -m venv "$RUNNER_TEMP/iconvenv"
          "$RUNNER_TEMP/iconvenv/bin/pip" install --quiet --disable-pip-version-check pillow
          echo "MD3_PYTHON=$RUNNER_TEMP/iconvenv/bin/python" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/iconvenv/bin/python" -c "import PIL; print('Pillow', PIL.__version__)"

      # ---------------------------------------------------------------------
      # 准备源码：优先用本仓库内的源码（若已同步上游），否则从上游拉取
      # ---------------------------------------------------------------------
      - name: 准备上游源码
        run: |
          set -euo pipefail
          if [ -f port/lib/main.dart ] && [ -f port/pubspec.yaml ]; then
            echo "[ci] 使用本仓库内的源码"
            mkdir -p app
            tar -C port -cf - --exclude=.git --exclude=.github . | tar -C app -xf -
          else
            echo "[ci] 从上游拉取 $UPSTREAM_REPO @ $UPSTREAM_REF"
            git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_REPO" app
          fi
          ls -la app | head -30

      - name: 叠加移植层（源码改造 + iOS 工程）
        run: bash port/scripts/apply_overlay.sh "$PWD/app" "$PWD/port"

      - name: 确认改动已落地
        run: |
          set -euo pipefail
          echo "--- Cargo.toml crate-type ---"
          grep -n 'crate-type' app/kugou_api_server/rust/Cargo.toml
          echo "--- Dart iOS 分支 ---"
          grep -n 'md3music-ios' app/lib/services/kugou_server.dart | head -10
          echo "--- ios/ 工程 ---"
          ls app/ios
          echo "--- 应用图标 ---"
          ls -lh app/ios/Runner/Assets.xcassets/AppIcon.appiconset/
          test -f app/ios/Runner/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png \
            || { echo "❌ AppIcon-1024.png 未生成"; exit 1; }
          echo "--- Rust podspec ---"
          test -f app/kugou_api_server/rust/kugou_server.podspec \
            || { echo "❌ kugou_server.podspec 未生成"; exit 1; }
          grep -n 'force_load' app/kugou_api_server/rust/kugou_server.podspec
          echo "--- Podfile 是否接入 kugou_server ---"
          grep -n "kugou_server" app/ios/Podfile

      # ---------------------------------------------------------------------
      # Rust API 服务器（best-effort：失败也能出 IPA，只是 App 没有本地 API）
      # ---------------------------------------------------------------------
      - name: 编译 Rust API 服务器为 XCFramework
        id: rust
        if: ${{ env.ATTACH_RUST == 'true' }}
        continue-on-error: true
        run: bash port/scripts/build_rust_ios.sh "$PWD/app"

      - name: Rust 编译结果
        if: ${{ steps.rust.conclusion != '' }}
        run: |
          if [ "${{ steps.rust.outcome }}" = "success" ]; then
            echo "✅ Rust XCFramework 构建成功，IPA 将包含本地 API 服务能力"
          else
            echo "⚠️ Rust XCFramework 构建失败，IPA 将以「无本地 API」模式产出（见上方日志）"
          fi

      - name: 检查静态库中的导出符号
        if: ${{ steps.rust.outcome == 'success' }}
        working-directory: app
        run: |
          set -uo pipefail
          LIB=kugou_api_server/rust/build/KugouServer.xcframework/ios-arm64/libkugou_server.a
          echo "归档: $LIB ($(du -h "$LIB" | cut -f1))"
          echo "--- 归档中的 C 导出符号 ---"
          nm -gU "$LIB" 2>/dev/null | grep -E '_start_server|_stop_server|_is_server_running|_get_server_port' || echo "(归档中未找到这些符号 —— 需要检查 Rust 侧 #[no_mangle] 导出)"
          echo "--- 归档全局符号总数 ---"
          nm -gU "$LIB" 2>/dev/null | wc -l

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # ---------------------------------------------------------------------
      # 构建 IPA
      # ---------------------------------------------------------------------
      - name: 构建 iOS（no-codesign）
        working-directory: app
        run: flutter build ios --release --no-codesign

      # ---------------------------------------------------------------------
      # 门禁：确认 Rust 符号真的进了二进制
      #
      # 这是上一次失败的直接原因 —— 静态库没被 -force_load 链进去，
      # 但构建依然"成功"，直到装到设备上才发现本地 API 起不来。
      # 这里用 nm 直接检查导出符号，缺失就中断，绝不放行。
      # ---------------------------------------------------------------------
      - name: 校验 Rust 符号已链接进 App 二进制
        working-directory: app
        run: |
          set -euo pipefail
          BIN="build/ios/iphoneos/Runner.app/Runner"
          [ -f "$BIN" ] || { echo "❌ 找不到 $BIN"; exit 1; }
          echo "二进制大小: $(du -h "$BIN" | cut -f1)"

          # Release 构建可能 strip 符号表，这里三条路径都试：
          #   nm  -> 符号表
          #   dyld_info -> 导出表（export trie）
          #   otool -Iv -> 间接符号表
          check_symbol() {
            local sym="$1"
            nm -gU "$BIN" 2>/dev/null | grep -q " $sym\$" && return 0
            dyld_info -exports "$BIN" 2>/dev/null | grep -q "[[:space:]]$sym\$" && return 0
            otool -Iv "$BIN" 2>/dev/null | grep -q "[[:space:]]$sym\$" && return 0
            return 1
          }

          MISSING=0
          for sym in _start_server _stop_server _is_server_running; do
            if check_symbol "$sym"; then
              echo "✅ 找到 $sym"
            else
              echo "❌ 缺失 $sym"
              MISSING=1
            fi
          done

          if [ "$MISSING" != "0" ]; then
            echo
            echo "===================== 诊断信息 ====================="
            echo "[podspec 里的 force_load]"
            grep -n "force_load" kugou_api_server/rust/kugou_server.podspec || echo "(未找到)"
            echo
            echo "[Pods-Runner 生成 xcconfig 里的 OTHER_LDFLAGS]"
            grep -rh "OTHER_LDFLAGS" "ios/Pods/Target Support Files/Pods-Runner/" 2>/dev/null || echo "(未找到)"
            echo
            echo "[pod install 是否识别到 kugou_server]"
            grep -n "kugou_server" ios/Podfile.lock 2>/dev/null || echo "(Podfile.lock 里没有 kugou_server)"
            echo
            echo "[nm 导出的符号总数]"
            nm -gU "$BIN" 2>/dev/null | wc -l || true
            echo
            echo "[含 kugou / server 的符号]"
            nm -a "$BIN" 2>/dev/null | grep -i -E "kugou|_start_server" | head -20 || true
            echo "===================================================="
            echo "❌ Rust 静态库未正确链接 —— 本地 API 服务将无法启动，中止构建"
            exit 1
          fi
          echo "✅ Rust 符号校验通过（本地 API 服务可用）"
          echo "true" > build/.rust-linked

      - name: 打包为 ipa
        id: package
        working-directory: app
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          [ -n "$VERSION" ] || VERSION="0.0.0"
          MODE="standard"
          HAS_RUST="$(cat build/.rust-linked 2>/dev/null || echo false)"
          if [ "$HAS_RUST" = "true" ]; then
            MODE="with-rust-server"
          fi
          NAME="MD3Music-${VERSION}-ios-${MODE}-unsigned"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IPA_NAME=$NAME" >> "$GITHUB_OUTPUT"
          echo "HAS_RUST=$HAS_RUST" >> "$GITHUB_OUTPUT"

          APP_PATH="build/ios/iphoneos/Runner.app"
          [ -d "$APP_PATH" ] || { echo "找不到 $APP_PATH"; exit 1; }

          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry "../${NAME}.ipa" Payload)

          ls -lh "build/${NAME}.ipa"
          echo "IPA_PATH=build/${NAME}.ipa" >> "$GITHUB_OUTPUT"

      - name: 上传 IPA（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.IPA_NAME }}
          path: app/${{ steps.package.outputs.IPA_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: 上传 dSYM（用于符号化崩溃日志）
        uses: actions/upload-artifact@v4
        with:
          name: dsym-${{ steps.package.outputs.APP_VERSION }}
          path: |
            app/build/ios/iphoneos/Runner.app.dSYM
            app/build/ios/iphoneos/*.dSYM
          if-no-files-found: ignore
          retention-days: 30

      - name: 构建摘要
        run: |
          {
            echo "## iOS 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${{ steps.package.outputs.APP_VERSION }}\` |"
            echo "| 产物 | \`${{ steps.package.outputs.IPA_NAME }}.ipa\` |"
            echo "| 上游基准 | \`$UPSTREAM_REF\` |"
            echo "| 签名 | 未签名（unsigned，需自行签名后安装） |"
            echo "| 应用图标 | ✅ 上游官方图标（assets/images/app_icon.png） |"
            echo "| Rust 本地 API | ${{ steps.package.outputs.HAS_RUST == 'true' && '✅ 已链接（符号校验通过）' || '⚠️ 未链接 —— 在线内容将不可用' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 标签触发时创建 Release
      # ---------------------------------------------------------------------
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MD3Music iOS ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## MD3Music iOS ${{ github.ref_name }}

            由 GitHub Actions 在 macOS runner 上自动构建。

            ### 下载
            - **${{ steps.package.outputs.IPA_NAME }}.ipa** — 未签名 IPA

            ### 说明
            - 本产物为 **unsigned IPA**，未做任何签名，无法直接安装到未越狱设备；
              需要自行用 AltStore / Sideloadly / 开发者证书重签后安装。
            - 最低系统版本：**iOS / iPadOS 15.0**（已在 iPadOS 16.4.1 上验证目标）
            - 应用图标：使用上游官方 `assets/images/app_icon.png`
            - 上游基准：`${{ env.UPSTREAM_REPO }}` @ `${{ env.UPSTREAM_REF }}`
            - Rust 本地 API 服务：${{ steps.package.outputs.HAS_RUST == 'true' && '**已链接**（`start_server` 等符号校验通过）' || '**未链接** —— 在线内容不可用' }}

            > 本项目为 md3Music 的 iOS 移植层，仅供学习研究，遵循 AGPL-3.0。
          files: |
            app/${{ steps.package.outputs.IPA_PATH }}
